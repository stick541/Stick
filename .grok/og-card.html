<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>ChatGPT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #171717; color: #ffffff;
    font-family: "Liberation Sans", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 1200px; height: 630px;
    display: flex;
    background: #212121;
  }
  .side {
    width: 268px; flex: none;
    background: #171717;
    display: flex; flex-direction: column;
    padding: 14px 12px 14px;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .side-top {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 8px; margin-bottom: 8px;
  }
  .side-top .mark { width: 26px; height: 26px; color: #ffffff; display: block; }
  .side-top .word {
    font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 10px; border-radius: 10px;
    color: rgba(255,255,255,0.88); font-size: 14.5px; font-weight: 400;
  }
  .row.new { color: #ffffff; }
  .row svg { width: 18px; height: 18px; flex: none; }
  .label {
    margin: 16px 10px 6px;
    font-size: 12px; letter-spacing: 0.04em;
    color: rgba(255,255,255,0.38); font-weight: 700;
    text-transform: uppercase;
  }
  .chat {
    height: 38px; display: flex; align-items: center;
    padding: 0 10px; border-radius: 10px;
    color: rgba(255,255,255,0.78); font-size: 14.5px;
  }
  .chat.active { background: rgba(255,255,255,0.06); color: #ffffff; }
  .spacer { flex: 1; }
  .user {
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 8px; border-radius: 12px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #ffffff; color: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .user span { font-size: 14.5px; color: #ffffff; }
  .main {
    flex: 1; display: flex; flex-direction: column;
    background: #212121; min-width: 0;
  }
  .header {
    height: 56px; display: flex; align-items: center; justify-content: center;
    gap: 6px; color: #ffffff; font-size: 15px; font-weight: 600;
  }
  .chev { width: 14px; height: 14px; opacity: 0.7; }
  .stage {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 8px;
  }
  .hero-mark { width: 84px; height: 84px; color: #ffffff; }
  .hero-word {
    margin-top: 18px;
    font-size: 58px; line-height: 1; font-weight: 700;
    letter-spacing: -0.04em; color: #ffffff;
  }
  .composer-wrap { padding: 8px 28px 26px; }
  .composer {
    height: 58px; border-radius: 29px;
    background: #2f2f2f;
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 12px;
    padding: 0 10px 0 16px;
  }
  .plus {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.85);
  }
  .plus svg { width: 20px; height: 20px; }
  .ph {
    flex: 1; color: rgba(255,255,255,0.42);
    font-size: 16.5px; font-weight: 400;
  }
  .send {
    width: 36px; height: 36px; border-radius: 50%;
    background: #ffffff; color: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
  }
  .send svg { width: 18px; height: 18px; }
</style>
</head>
