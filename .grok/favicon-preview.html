<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#888;}
  img{display:block;image-rendering:auto;}
  .row{display:flex;gap:24px;align-items:flex-end;padding:24px;background:#cfcfcf;}
  .dark{background:#2a2a2a;}
</style></head>
<body>
<div class="row">
  <img width="16" height="16" src="favicon.svg"/>
  <img width="32" height="32" src="favicon.svg"/>
  <img width="64" height="64" src="favicon.svg"/>
</div>
<div class="row dark">
  <img width="16" height="16" src="favicon.svg"/>
  <img width="32" height="32" src="favicon.svg"/>
  <img width="180" height="180" src="favicon.svg"/>
</div>
</body></html>
